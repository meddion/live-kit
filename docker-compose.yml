services:
  livekit-meet:
    container_name: livekit-meet
    build:
      context: .
      dockerfile: Dockerfile.livekit-meet
    restart: unless-stopped
    ports:
      - "3088:3088"
    env_file:
      - ${ENV_FILE:-.env}
  livekit-app:
    container_name: livekit-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ${ENV_FILE:-.env}
    volumes:
      - ./data:/app/data
      - ${USERS_FILE_PATH:-./users.json}:/app/users.json:ro
  livekit-server:
    container_name: livekit-server
    image: livekit/livekit-server:v1.13
    env_file:
      - ${ENV_FILE:-.env}
    command: --config /etc/livekit.yaml --bind 0.0.0.0 ${LIVEKIT_SERVER_DEV_FLAG:-}
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
